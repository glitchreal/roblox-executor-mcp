<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <style>
      .bg-card {
        fill: #141211;
        stroke: #2E2925;
        stroke-width: 1.5px;
      }
      .text-title {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #FBF7F5;
        letter-spacing: -1px;
      }
      .text-desc {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #A39B92;
      }
    </style>
  </defs>

  <!-- Outer Canvas Container (Original 1200x400 Dimensions) -->
  <rect width="1200" height="400" class="bg-card" />

  <!-- Perfectly Centered Title + Claude GIF Row -->
  <g transform="translate(355, 142)">
    <image href="data:image/gif;base64," x="0" y="0" width="44" height="44" />
    <text x="56" y="38" class="text-title">Roblox Executor MCP</text>
  </g>

  <!-- Subtitle Text (Positioned Close to Title) -->
  <g class="text-desc">
    <text x="600" y="222" text-anchor="middle">An MCP server that allows AI agents to interact with a running Roblox game client —</text>
    <text x="600" y="248" text-anchor="middle">execute code, inspect scripts, spy on remotes, search instances, and more.</text>
  </g>
</svg>